<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SGN - Conceitos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .terminal { 
            font-family: 'Fira Code', monospace; 
            background: #0d1117; 
            color: #3fb950; 
            height: 350px; 
            overflow-y: auto; 
            border: 1px solid #30363d; 
            padding: 10px;
            border-radius: 8px;
        }
        .log-error { color: #f85149; }
        .log-info { color: #3fb950; }
    </style>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <a href="/" class="text-blue-500 mb-4 inline-block">← Voltar para o Início</a>
        
        <h1 class="text-2xl font-bold mb-6 text-gray-800">Lançador de Conceitos (SGN)</h1>

        <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-sm font-bold mb-1">Usuário SGN</label>
                <input type="text" id="user" placeholder="Ex: 12345678900" class="w-full p-2 border rounded">
            </div>
            <div>
                <label class="block text-sm font-bold mb-1">Senha</label>
                <input type="password" id="password" placeholder="Sua senha" class="w-full p-2 border rounded">
            </div>

            <div class="col-span-2 flex items-center gap-2">
                <input type="checkbox" id="rememberCredentials" class="h-4 w-4 text-green-600 rounded border-gray-300 focus:ring-green-500">
                <label for="rememberCredentials" class="text-sm text-gray-700">Lembrar informações de usuário neste navegador</label>
            </div>

            <div>
                <label for="turmaSelect" class="block text-sm font-bold mb-1">Turma</label>
                <div class="flex gap-2">
                    <select id="turmaSelect" class="flex-1 p-2 border rounded bg-white">
                        <option value="">Carregando turmas...</option>
                    </select>
                    <button id="btnManageTurmas" title="Gerenciar Turmas" class="bg-gray-200 px-3 rounded hover:bg-gray-300">⚙️</button>
                </div>
            </div>

            <div>
                <label for="ucSelect" class="block text-sm font-bold mb-1">Unidade Curricular (UC)</label>
                <div class="flex gap-2">
                    <select id="ucSelect" class="flex-1 p-2 border rounded bg-white">
                        <option value="">Carregando UCs...</option>
                    </select>
                    <button id="btnManageUcs" title="Gerenciar UCs" class="bg-gray-200 px-3 rounded hover:bg-gray-300">⚙️</button>
                </div>
            </div>

            <div class="col-span-2">
                <label for="diaryLinkInput" class="block text-sm font-bold mb-1">Link do Diário (URL)</label>
                <input type="text" id="diaryLinkInput" placeholder="Ex: https://sgn.fiesc.edu.br/... (ou deixe vazio para usar link salvo)" class="w-full p-2 border rounded text-sm">
                <div class="text-xs text-gray-500 mt-1">💡 Se o UC selecionado não tiver link configurado, cole o URL do diário aqui</div>
            </div>

            <div>
                <label class="block text-sm font-bold mb-1">Avaliação / Coluna</label>
                <input type="text" id="avSelection" placeholder="Ex: TR1, Trabalho, Prova" class="w-full p-2 border rounded">
            </div>

            <div>
                <label for="trSelect" class="block text-sm font-bold mb-1">Período / Trimestre</label>
                <select id="trSelect" class="w-full p-2 border rounded bg-white">
                    <option value="TR1">TR1</option>
                    <option value="TR2">TR2</option>
                    <option value="TR3" selected>TR3</option>
                    <option value="TR4">TR4</option>
                </select>
            </div>
        </div>

        <div class="mb-4 border rounded-lg border-gray-200 bg-slate-50 p-4">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-3">
                <div class="font-semibold text-gray-800">Lista de Conceitos</div>
                <div class="flex flex-wrap gap-2">
                    <button id="btnSyncClass" class="px-3 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Sincronizar turma</button>
                    <button id="btnJsonMode" class="px-3 py-2 bg-purple-600 text-white rounded hover:bg-purple-700">Conceitos via JSON</button>
                    <button id="btnToggleMode" class="px-3 py-2 bg-slate-700 text-white rounded hover:bg-slate-800">Ver lista visual</button>
                </div>
            </div>

            <div id="visualListContainer" class="space-y-2"></div>
            <textarea id="jsonEditor" class="hidden w-full p-3 border rounded-lg font-mono text-sm h-56 resize-none" placeholder='Cole aqui um JSON de conceitos'></textarea>

            <div class="mt-3 flex flex-wrap gap-2">
                <button id="btnAllA" class="px-3 py-2 bg-green-600 text-white rounded hover:bg-green-700">Tudo A</button>
                <button id="btnAllB" class="px-3 py-2 bg-yellow-600 text-white rounded hover:bg-yellow-700">Tudo B</button>
                <button id="btnAllC" class="px-3 py-2 bg-teal-600 text-white rounded hover:bg-teal-700">Tudo C</button>
            </div>
        </div>

        <div class="flex gap-4 mb-6">
            <button id="btnRun" class="flex-1 bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition">
                INICIAR ROBÔ
            </button>
            <button id="btnCancel" class="hidden bg-red-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-red-700 transition">
                PARAR
            </button>
        </div>

        <div id="terminal" class="terminal">
            <div>[SISTEMA] Aguardando inicialização...</div>
        </div>
    </div>

    <script src="/modalTurma.js"></script>
    <script src="/modalUc.js"></script>

    <script>
        // Mapeamento de elementos para evitar erro de 'null'
        const elements = {
            user: document.getElementById('user'),
            pass: document.getElementById('password'),
            remember: document.getElementById('rememberCredentials'),
            turmaSelect: document.getElementById('turmaSelect'),
            ucSelect: document.getElementById('ucSelect'),
            diaryLinkInput: document.getElementById('diaryLinkInput'),
            avSelection: document.getElementById('avSelection'),
            jsonEditor: document.getElementById('jsonEditor'),
            visualListContainer: document.getElementById('visualListContainer'),
            btnRun: document.getElementById('btnRun'),
            btnCancel: document.getElementById('btnCancel'),
            terminal: document.getElementById('terminal'),
            btnManageTurmas: document.getElementById('btnManageTurmas'),
            btnManageUcs: document.getElementById('btnManageUcs')
        };

        let currentJobId = null;
        let currentMode = 'visual';
        let currentStudentList = [];
        let turmaDataMap = {};

        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = type === 'error' ? 'log-error' : 'log-info';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            elements.terminal.appendChild(div);
            elements.terminal.scrollTop = elements.terminal.scrollHeight;
        }

        function normalizeArrayResponse(responseData) {
            if (Array.isArray(responseData)) return responseData;
            if (responseData && typeof responseData === 'object') {
                return Object.entries(responseData).map(([key, value]) => {
                    if (value && typeof value === 'object') {
                        return { id: key, nome: key, alunos: value };
                    }
                    const isUrl = typeof value === 'string' && value.startsWith('http');
                    return { 
                        id: key, 
                        nome: key, 
                        alunos: isUrl ? undefined : value,
                        link_diario: isUrl ? value : undefined 
                    };
                });
            }
            return [];
        }

        function buildStudentConceptsFromSelectedTurma() {
            const turmaId = elements.turmaSelect.value;
            if (!turmaId || !turmaDataMap[turmaId]) return [];

            const alunoData = turmaDataMap[turmaId];
            if (Array.isArray(alunoData)) {
                return alunoData.map(nome => ({ nome, conceito: 'C' }));
            }

            if (alunoData && typeof alunoData === 'object') {
                const values = Object.values(alunoData).flat();
                return values.map(nome => ({ nome, conceito: 'C' }));
            }

            return [];
        }

        function renderVisualList() {
            const container = document.getElementById('visualListContainer');
            container.innerHTML = '';

            currentStudentList.forEach((student, index) => {
                const row = document.createElement('div');
                row.className = 'flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 p-3 rounded border border-gray-200 bg-white';
                row.dataset.index = index;

                const nameDiv = document.createElement('div');
                nameDiv.className = 'flex-1 text-sm text-gray-800';
                nameDiv.textContent = student.nome;

                const select = document.createElement('select');
                select.className = 'p-2 border rounded bg-white text-sm w-24';
                ['A', 'B', 'C'].forEach(value => {
                    const opt = document.createElement('option');
                    opt.value = value;
                    opt.textContent = value;
                    if (student.conceito === value) opt.selected = true;
                    select.appendChild(opt);
                });
                select.addEventListener('change', () => {
                    student.conceito = select.value;
                    updateJsonEditor();
                });

                const removeButton = document.createElement('button');
                removeButton.type = 'button';
                removeButton.className = 'px-3 py-2 bg-red-500 text-white rounded hover:bg-red-600 text-sm';
                removeButton.textContent = 'Remover';
                removeButton.addEventListener('click', () => {
                    currentStudentList.splice(index, 1);
                    renderVisualList();
                    updateJsonEditor();
                });

                const controls = document.createElement('div');
                controls.className = 'flex gap-2 items-center';
                controls.appendChild(select);
                controls.appendChild(removeButton);

                row.appendChild(nameDiv);
                row.appendChild(controls);
                container.appendChild(row);
            });
        }

        function updateJsonEditor() {
            const editor = document.getElementById('jsonEditor');
            editor.value = JSON.stringify(currentStudentList, null, 2);
        }

        function setAllConcepts(value) {
            currentStudentList = currentStudentList.map(student => ({ ...student, conceito: value }));
            if (currentMode === 'visual') {
                renderVisualList();
            }
            updateJsonEditor();
        }

        function switchToJsonMode() {
            currentMode = 'json';
            elements.jsonEditor.classList.remove('hidden');
            document.getElementById('visualListContainer').classList.add('hidden');
            document.getElementById('btnToggleMode').textContent = 'Ver lista visual';
            updateJsonEditor();
        }

        function switchToVisualMode() {
            currentMode = 'visual';
            elements.jsonEditor.classList.add('hidden');
            document.getElementById('visualListContainer').classList.remove('hidden');
            document.getElementById('btnToggleMode').textContent = 'Modo JSON';
            renderVisualList();
        }

        function syncClassList() {
            currentStudentList = buildStudentConceptsFromSelectedTurma();
            if (currentMode === 'visual') {
                renderVisualList();
            }
            updateJsonEditor();
            if (currentStudentList.length === 0) {
                elements.visualListContainer.innerHTML = '<div class="text-sm text-gray-500">Selecione uma turma para carregar os alunos.</div>';
            }
        }

        function generateJsonWithAllC() {
            currentStudentList = buildStudentConceptsFromSelectedTurma();
            currentStudentList = currentStudentList.map(student => ({ ...student, conceito: 'C' }));
            switchToJsonMode();
        }

        function getPayloadStudentList() {
            const jsonText = elements.jsonEditor.value?.trim();
            if (jsonText.length > 0) {
                try {
                    const parsed = JSON.parse(jsonText);
                    if (!Array.isArray(parsed)) throw new Error('JSON deve ser um array');
                    return parsed.map(item => ({ nome: item.nome, conceito: item.conceito }));
                } catch (err) {
                    throw new Error('JSON inválido: ' + err.message);
                }
            }
            return currentStudentList;
        }

        // --- FUNÇÕES DE BUSCA NO BANCO (NEON) ---

        async function refreshTurmaOptions() {
            try {
                const res = await fetch('https://bot-conceitos-sgn.onrender.com/turmas');
                if (!res.ok) throw new Error('Erro na API de turmas');
                const data = await res.json();
                const turmas = normalizeArrayResponse(data);
                
                turmaDataMap = {};
                elements.turmaSelect.innerHTML = '<option value="">Selecione uma turma</option>';
                turmas.forEach(t => {
                    const turmaId = t.id ?? t.nome ?? '';
                    let alunos = t.alunos;
                    if (typeof alunos === 'string') {
                        try {
                            alunos = JSON.parse(alunos);
                        } catch (e) {
                            alunos = alunos.split(',').map(item => item.trim()).filter(Boolean);
                        }
                    }
                    turmaDataMap[turmaId] = alunos;
                    const opt = document.createElement('option');
                    opt.value = turmaId;
                    opt.textContent = t.nome ?? turmaId;
                    elements.turmaSelect.appendChild(opt);
                });
                log("✅ Turmas sincronizadas com o Banco Neon.");
            } catch (err) {
                log("❌ Erro ao buscar turmas: " + err.message, "error");
            }
        }

        async function refreshUcOptions() {
            try {
                const res = await fetch('https://bot-conceitos-sgn.onrender.com/ucs');
                if (!res.ok) throw new Error('Erro na API de UCs');
                const data = await res.json();
                const ucs = normalizeArrayResponse(data);
                
                elements.ucSelect.innerHTML = '<option value="">Selecione uma UC</option>';
                ucs.forEach(u => {
                    const opt = document.createElement('option');
                    // Usa link_diario se disponível, senão usa o ID como fallback
                    opt.value = u.link_diario || u.id || u.nome || '';
                    opt.textContent = u.nome ?? u.id;
                    elements.ucSelect.appendChild(opt);
                });
                log("✅ UCs sincronizadas com o Banco Neon.");
            } catch (err) {
                log("❌ Erro ao buscar UCs: " + err.message, "error");
            }
        }

        // --- INICIALIZAÇÃO ---

        window.addEventListener('DOMContentLoaded', async () => {
            log("Iniciando conexão com o servidor...");
            
            // Carrega credenciais salvas, se houver
            try {
                const savedCredentials = localStorage.getItem('botConceitosCredentials');
                if (savedCredentials) {
                    const parsed = JSON.parse(savedCredentials);
                    elements.user.value = parsed.user || '';
                    elements.pass.value = parsed.password || '';
                    elements.remember.checked = true;
                    log('✅ Credenciais carregadas do navegador.');
                }
            } catch (err) {
                console.warn('Erro ao carregar credenciais salvas:', err);
            }

            // Carrega os dados iniciais
            await Promise.all([refreshTurmaOptions(), refreshUcOptions()]);

            // Configura os botões de engrenagem (Modais)
            elements.btnManageTurmas.addEventListener('click', () => {
                if (typeof openTurmaModal === 'function') {
                    openTurmaModal(refreshTurmaOptions);
                } else {
                    log("Erro: Script modalTurma.js não carregado.", "error");
                }
            });

            elements.btnManageUcs.addEventListener('click', () => {
                if (typeof openUcModal === 'function') {
                    openUcModal(refreshUcOptions);
                } else {
                    log("Erro: Script modalUc.js não carregado.", "error");
                }
            });

            elements.turmaSelect.addEventListener('change', () => {
                syncClassList();
            });

            document.getElementById('btnSyncClass').addEventListener('click', (event) => {
                event.preventDefault();
                syncClassList();
            });

            document.getElementById('btnJsonMode').addEventListener('click', (event) => {
                event.preventDefault();
                generateJsonWithAllC();
            });

            document.getElementById('btnToggleMode').addEventListener('click', (event) => {
                event.preventDefault();
                if (currentMode === 'visual') {
                    switchToJsonMode();
                } else {
                    switchToVisualMode();
                }
            });

            document.getElementById('btnAllA').addEventListener('click', (event) => {
                event.preventDefault();
                setAllConcepts('A');
            });

            document.getElementById('btnAllB').addEventListener('click', (event) => {
                event.preventDefault();
                setAllConcepts('B');
            });

            document.getElementById('btnAllC').addEventListener('click', (event) => {
                event.preventDefault();
                setAllConcepts('C');
            });

            syncClassList();

            // Lógica do Botão Iniciar
            elements.btnRun.addEventListener('click', async () => {
                let payloadStudentList;
                try {
                    payloadStudentList = getPayloadStudentList();
                } catch (err) {
                    alert(err.message);
                    elements.btnRun.disabled = false;
                    elements.btnRun.innerText = 'INICIAR ROBÔ';
                    elements.btnCancel.classList.add('hidden');
                    return;
                }

                const manualLink = elements.diaryLinkInput?.value?.trim();
                const payload = {
                    user: elements.user.value,
                    password: elements.pass.value,
                    diaryLink: manualLink || elements.ucSelect.value,
                    avSelection: elements.avSelection.value,
                    jsonData: payloadStudentList,
                    trSelection: document.getElementById('trSelect')?.value
                };

                // DEBUG: Log dos valores para verificar o que está vazio
                console.log("🔍 DEBUG - Payload antes de validar:", {
                    user: payload.user ? "✅ " + payload.user : "❌ vazio",
                    password: payload.password ? "✅ preenchido" : "❌ vazio",
                    diaryLink: payload.diaryLink ? "✅ " + payload.diaryLink : "❌ vazio",
                    avSelection: payload.avSelection ? "✅ " + payload.avSelection : "❌ vazio",
                    jsonData: payload.jsonData.length + " alunos"
                });

                if (!payload.user || !payload.password || !payload.diaryLink || !payload.avSelection) {
                    alert("Preencha: Usuário, Senha, UC (ou Link Manual) e Avaliação/Coluna!");
                    elements.btnRun.disabled = false;
                    elements.btnRun.innerText = 'INICIAR ROBÔ';
                    elements.btnCancel.classList.add('hidden');
                    return;
                }

                if (!Array.isArray(payload.jsonData) || payload.jsonData.length === 0) {
                    alert("Adicione pelo menos um aluno com conceito na lista de conceitos (visual ou JSON)!");
                    elements.btnRun.disabled = false;
                    elements.btnRun.innerText = 'INICIAR ROBÔ';
                    elements.btnCancel.classList.add('hidden');
                    return;
                }

                try {
                    elements.btnRun.disabled = true;
                    elements.btnRun.innerText = 'PROCESSANDO...';
                    elements.btnCancel.classList.remove('hidden');
                    
                    const res = await fetch('/api/run-conceitos', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    const data = await res.json();
                    if (elements.remember.checked) {
                        localStorage.setItem('botConceitosCredentials', JSON.stringify({
                            user: payload.user,
                            password: payload.password
                        }));
                    } else {
                        localStorage.removeItem('botConceitosCredentials');
                    }
                    currentJobId = data.jobId;
                    pollStatus(currentJobId);
                } catch (error) {
                    log("Erro ao iniciar: " + error.message, "error");
                    resetButtons();
                }
            });
        });

        async function pollStatus(jobId) {
            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`/api/status/${jobId}`);
                    const data = await res.json();
                    
                    elements.terminal.innerHTML = ''; // Limpa para mostrar logs atualizados
                    data.logs.forEach(m => log(m));

                    if (data.status === 'completed' || data.status === 'failed') {
                        clearInterval(interval);
                        resetButtons();
                        log(data.status === 'completed' ? "🏁 Finalizado com sucesso!" : "⚠️ O robô parou com erros.", data.status === 'completed' ? 'info' : 'error');
                    }
                } catch (e) {
                    clearInterval(interval);
                }
            }, 2000);
        }

        function resetButtons() {
            elements.btnRun.disabled = false;
            elements.btnRun.innerText = 'INICIAR ROBÔ';
            elements.btnCancel.classList.add('hidden');
        }
    </script>
</body>
</html>
